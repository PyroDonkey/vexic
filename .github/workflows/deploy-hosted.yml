name: Deploy Hosted

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        # Exact pin required: setup-uv stopped publishing floating major tags after v7
        # (no @v8 exists upstream; @v8 fails at workflow parse time).
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Run tests
        run: uv run pytest

  docker-build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build hosted image
        run: docker build --tag vexic-hosted:${{ github.sha }} .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    environment: railway-alpha
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.23.1
      - name: Deploy to Railway
        run: railway up --ci --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production --service vexic
      - name: Verify hosted health
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 10 --connect-timeout 5 --max-time 15 --retry-connrefused https://api.vexic.dev/health
      - name: Verify hosted control-plane route
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /tmp/control-plane-smoke.json --write-out "%{http_code}" --retry 12 --retry-all-errors --retry-delay 10 --connect-timeout 5 --max-time 15 --retry-connrefused https://api.vexic.dev/control/v1/clerk-orgs/deploy-smoke/projects)"
          cat /tmp/control-plane-smoke.json
          test "$status" = "401"
